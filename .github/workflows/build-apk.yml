name: Build To Bus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Montar estrutura Android
        run: |
          mkdir -p app/src/main/java/com/tobus/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # =========================
          # ARQUIVOS WEB DO TO BUS
          # =========================

          cp index.html app/src/main/assets/
          cp styles.css app/src/main/assets/
          cp app.js app/src/main/assets/
          cp config.js app/src/main/assets/

          if [ -f logo.png ]; then
            cp logo.png app/src/main/assets/
          fi

          # =========================
          # RECURSOS ANDROID
          # =========================

          cp data_extraction_rules.xml \
          app/src/main/res/xml/data_extraction_rules.xml

          cp network_security_config.xml \
          app/src/main/res/xml/network_security_config.xml

          cp styles.xml \
          app/src/main/res/values/styles.xml

          # =========================
          # MAIN ACTIVITY
          # =========================

          cat > app/src/main/java/com/tobus/app/MainActivity.java <<'EOF'
          package com.tobus.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

          # =========================
          # ANDROID MANIFEST
          # =========================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:label="To Bus"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # =========================
          # SETTINGS.GRADLE
          # =========================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ToBus"

          include(":app")
          EOF

          # =========================
          # BUILD.GRADLE PRINCIPAL
          # =========================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }

          allprojects {
              configurations.all {
                  resolutionStrategy {

                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'

                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

          # =========================
          # APP/BUILD.GRADLE
          # =========================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.tobus.app'

              compileSdk 35

              defaultConfig {

                  applicationId "com.tobus.app"

                  minSdk 24

                  targetSdk 35

                  versionCode 2

                  versionName "1.1"
              }
          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.7.1'

              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }

          configurations.all {

              resolutionStrategy {

                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'

                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ToBus-MVP-APK-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
