name: Verificar Gradle To Bus

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Mostrar estrutura do projeto
        run: |
          echo "=== ARQUIVOS DA RAIZ ==="
          ls -la
          echo ""
          echo "=== SETTINGS.GRADLE ==="
          cat settings.gradle || true
          echo ""
          echo "=== BUILD.GRADLE ==="
          cat build.gradle || true

      - name: Descobrir projetos Gradle
        run: |
          gradle projects

      - name: Descobrir tarefas Gradle
        run: |
          gradle tasks --all
