name: Build To Bus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar arquivos do aplicativo
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp styles.css app/src/main/assets/styles.css
          cp app.js app/src/main/assets/app.js
          cp config.js app/src/main/assets/config.js
          cp logo.png app/src/main/assets/logo.png

      - name: Verificar arquivos do aplicativo
        run: |
          echo "Arquivos dentro do APK:"
          ls -la app/src/main/assets

      - name: Gerar APK
        run: gradle assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ToBus-Demo-APK
          path: app/build/outputs/apk/debug/*.apk
