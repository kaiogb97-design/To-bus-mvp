name: Teste To Bus Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar aplicativo Android de teste
        run: |
          mkdir -p app/src/main/java/com/tobus/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ToBus"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tobus.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.tobus.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName "1.2-test"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="To Bus Teste"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/tobus/app/MainActivity.java <<'EOF'
          package com.tobus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);

                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(40, 40, 40, 40);
                  layout.setBackgroundColor(Color.rgb(10, 10, 12));

                  TextView titulo = new TextView(this);

                  titulo.setText("To Bus");
                  titulo.setTextSize(34);
                  titulo.setTextColor(Color.WHITE);
                  titulo.setGravity(Gravity.CENTER);

                  TextView status = new TextView(this);

                  status.setText(
                      "\nAplicativo iniciado com sucesso!\n\n" +
                      "O sistema Android do To Bus está funcionando."
                  );

                  status.setTextSize(18);
                  status.setTextColor(Color.LTGRAY);
                  status.setGravity(Gravity.CENTER);

                  layout.addView(titulo);
                  layout.addView(status);

                  setContentView(layout);
              }
          }
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ToBus-Teste-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
