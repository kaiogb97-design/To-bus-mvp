name: Build APK To Bus

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar arquivos do To Bus
        run: |
          mkdir -p app/src/main/assets/css
          mkdir -p app/src/main/assets/js

          # Copia o CSS
          if [ -d "css" ]; then
            cp -r css/. app/src/main/assets/css/
          fi

          # Copia os JavaScripts
          if [ -d "js" ]; then
            cp -r js/. app/src/main/assets/js/
          fi

          # Copia a configuração
          if [ -f "config.js" ]; then
            cp config.js app/src/main/assets/config.js
          fi

          # Copia a logo, se existir
          if [ -f "logo.png" ]; then
            cp logo.png app/src/main/assets/logo.png
          fi

          echo "=== ARQUIVOS QUE ENTRARÃO NO APK ==="
          find app/src/main/assets -type f | sort

      - name: Gerar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Mostrar APK gerado
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: To-Bus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
